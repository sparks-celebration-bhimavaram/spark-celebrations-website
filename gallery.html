    <script src="assets/js/script.js"></script>
    <script>
        function playGalleryVideo(element) {
            const sourceEl = element.querySelector('source');
            const videoSource = sourceEl ? sourceEl.getAttribute('src') : '';
            if (!videoSource || videoSource === "" || videoSource === "#") {
                return; // Prevent opening modal for blank video
            }
            const modal = document.getElementById('video-modal');
            const modalVideo = document.getElementById('modal-video');
            modalVideo.src = videoSource;
            modal.classList.remove('hidden');
            setTimeout(() => modal.classList.add('opacity-100'), 10);
            document.body.style.overflow = 'hidden';
            modalVideo.play();
        }
        function closeGalleryVideo() {
            const modal = document.getElementById('video-modal');
            const modalVideo = document.getElementById('modal-video');
            modal.classList.remove('opacity-100');
            setTimeout(() => {
                modal.classList.add('hidden');
                modalVideo.pause();
                modalVideo.src = "";
                document.body.style.overflow = '';
            }, 300);
        }
    </script>
